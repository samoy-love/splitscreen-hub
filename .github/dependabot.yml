version: 2

# Обновления зависимостей раз в неделю, по понедельникам: реже — и копится
# пачка, которую разбирают залпом и потому невнимательно; чаще — и PR
# перестают читать вовсе.
#
# Не-мажорные обновления собираются в один PR: пять отдельных PR «поднять
# патч-версию экшена» читают ровно так же внимательно, как один, — то есть
# никак, — но стоят пяти прогонов checks.yml.
#
# open-pull-requests-limit держит очередь короткой намеренно. Двадцать
# открытых PR от бота — это не двадцать обновлений, а ноль.
#
# Сообщения на русском в повелительном наклонении, как везде в этих
# репозиториях (CLAUDE.md). Префикс deps: отделяет машинные правки от
# человеческих; заодно генератор списка релиза считает такую тему шумом и
# не тащит её в version.json.
#
# Экосистема здесь ровно одна, и это не упущение:
#   * package.json, go.mod, requirements.txt в репозитории нет — приложение
#     на C++ собирается cmake, а pipeline/ — скрипты на голом Python;
#   * app/lib/borealis — подмодуль git, и gitsubmodule здесь намеренно НЕ
#     подключён: у подмодуля нет версий, поэтому «обновлением» для него
#     считается каждый коммит вышестоящей ветки, а закреплённый коммит
#     borealis связан с нашей разметкой — её сверяет app/tools/check_xml.py
#     по исходникам самой borealis. Такой PR обязан читаться человеком, а не
#     приезжать еженедельно.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps'
