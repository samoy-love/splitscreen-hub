name: Deploy

# Выкатка через общий пайплайн deploy-kit: мерж в master собирает .nro в
# контейнере devkitPro и публикует его на samoy.love/splitscreen-hub/ вместе с
# .sha256 и манифестом версии, по которому приложение на консоли предлагает
# обновиться. Правила и контракт — в CLAUDE.md и в deploy-kit.
#
# Фильтр путей: только то, что попадает в .nro. README, пайплайн данных и
# правила репозитория артефакт не меняют — пустой прогон незачем.
#
# `deployments: write` объявляется с обеих сторон (см. static-site.yml в
# deploy-kit): переиспользуемый workflow не может запросить больше прав, чем
# есть у вызывающего.

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.deploy-kit/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  nro:
    uses: tr0llex/deploy-kit/.github/workflows/desktop-artifact.yml@main
    with:
      config: .deploy-kit/nro.env
      runner: ubuntu-latest
      # Гейт перед публикацией. Вход gates у desktop-artifact.yml
      # необязательный, и не заданный он означает буквально «публиковать, не
      # проверив ничего»: сборка .nro падает только на ошибках компиляции, а
      # логика форматирования и разбора запроса каталога компилируется и
      # неправильной.
      #
      # ИМЕННО run_tests.sh, и только он: из проверок checks.yml это
      # единственная, которая здесь и уместна, и выполнима.
      #   * тесты чистых функций (app/tests) собираются обычным
      #     g++ -std=c++17, а он на ubuntu-latest уже есть: ни devkitPro, ни
      #     подмодуля, ни сети. Секунды против получаса сборки .nro в
      #     контейнере;
      #   * check_xml.py сверяет разметку с исходниками borealis, но подмодуль
      #     на этом шаге ещё не выкачан — его инициализирует сама сборка
      #     (app/tools/build_release.sh), то есть ПОСЛЕ гейта. Проверка упала
      #     бы не на разметке, а на отсутствии файлов;
      #   * проверка сообщений коммитов к артефакту отношения не имеет.
      # Полного прогона checks.yml здесь нет намеренно: он гейт этапа PR, а
      # деплой лишь убеждается, что код собирается и считает верно (CLAUDE.md).
      #
      # Строку исполняет pwsh через Invoke-Expression (см. шаг «Проверки» в
      # desktop-artifact.yml), поэтому bash зовётся явно.
      #
      # Код возврата 2 у скрипта — «рабочего компилятора не нашлось, проверить
      # не удалось». Для гейта это тоже отказ, и намеренно: зелёная выкатка по
      # непроверенному коду — ровно то, ради чего этот вход и заводится.
      gates: bash app/tools/run_tests.sh
    secrets: inherit
