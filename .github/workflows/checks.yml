# Проверки, которым не нужны ни консоль, ни тулчейн devkitPro: разметка против
# атрибутов, которые понимает borealis, и тесты чистых функций.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Разметка понятна borealis
        working-directory: app
        run: python tools/check_xml.py

      - name: Тесты чистых функций
        working-directory: app
        run: bash tools/run_tests.sh
